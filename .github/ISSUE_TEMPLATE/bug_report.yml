name: Bug report
description: Report a reproducible problem in CGPA Pilot.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve CGPA Pilot. Do not include credentials or personal data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or logs after removing sensitive information.
